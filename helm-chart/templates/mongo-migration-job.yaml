apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "orders-app.fullname" . }}-mongo-migration
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          command: ["bash","-lc"]
          args:
            - |
              cat <<'JS' > /tmp/migrate.js
              conn = new Mongo();
              db = conn.getDB("ordersdb");
              db.orders.insertMany([
                {customer: "Ivan", item: "Book", amount: 12.5},
                {customer: "Anna", item: "Pen", amount: 2.3},
                {customer: "Sergey", item: "Notebook", amount: 5.0}
              ]);
              JS
              mongo --host mongodb --eval "load('/tmp/migrate.js')"
          env:
            - name: MONGO_HOST
              value: mongodb
      # Запуск после поднятия mongodb
      initContainers:
        - name: wait-for-mongo
          image: busybox
          command: ['sh','-c','until nslookup mongodb; do echo waiting; sleep 2; done']
