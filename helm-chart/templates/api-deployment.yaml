apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "orders-app.fullname" . }}-api
  labels:
    app: orders-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}"
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          ports:
            - containerPort: 8000  # ИЗМЕНИТЬ с 8080 на 8000

          envFrom:
            - configMapRef:
                name: {{ include "orders-app.fullname" . }}-api-config
          env:
            - name: MONGO_USERNAME
              value: "{{ .Values.mongodb.auth.username }}"
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "orders-app.fullname" . }}-mongodb-user-password
                  key: password

          readinessProbe:
            httpGet:
              path: /orders
              port: 8000  # Уже правильно
            initialDelaySeconds: 10  # Увеличить с 5 до 10, чтобы дать время на подключение к MongoDB
            periodSeconds: 10
            timeoutSeconds: 5  # Добавить явный timeout