replicaCount: 1

image:
  api:
    repository: orders-api
    tag: "0.17"
    pullPolicy: IfNotPresent
  logger:
    repository: orders-logger
    tag: "0.17"
    pullPolicy: IfNotPresent

service:
  api:
    port: 8000
    targetPort: 8000

# Новые секции: образы для Mongo / ZooKeeper / Kafka
mongo:
  enabled: true
  image:
    repository: mongo
    tag: "5.0"    # использую 5.x чтобы в контейнере доступна команда `mongo`
    pullPolicy: IfNotPresent
  persistence:
    enabled: false

zookeeper:
  enabled: true
  image:
    repository: confluentinc/cp-zookeeper
    tag: "7.4.0"
    pullPolicy: IfNotPresent
  replicaCount: 1

kafka:
  enabled: true
  image:
    repository: confluentinc/cp-kafka
    tag: "7.4.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  config:
    # KAFKA_ADVERTISED_LISTENERS будет настроен в шаблонах
    offsetsTopicReplicationFactor: 1

migration:
  enabled: true
  image:
    repository: mongo
    tag: "5.0"
    pullPolicy: IfNotPresent

resources: {}

podAnnotations: {}

logger:
  logPath: /var/log/orders.log


  # ... существующие настройки (image, service, kafka, zookeeper)

# НОВАЯ СЕКЦИЯ: Настройки MongoDB через оператор
mongodb:
  # Количество реплик в кластере (рекомендуется 3 для продакшена, 1 для тестов)
  members: 2
  # Версия MongoDB
  version: "6.0.6"
  # Имя базы данных, которую будет использовать приложение
  database: "ordersdb"

#  serviceName: "orders-app-test-mongodb-svc"  # Или оставьте пустым для автоопределения
  serviceName:   # Или оставьте пустым для автоопределения

  # Настройки аутентификации
  auth:
    username: "orderServiceUser"
    # ПАРОЛЬ БУДЕТ ЗАКОДИРОВАН В BASE64 ПРИ УСТАНОВКЕ
    password: "StrongPassword123!"  # ЗАМЕНИТЕ на свой надежный пароль!

  # Настройки хранилища
  persistence:
    enabled: true
    # StorageClass зависит от вашего кластера:
    # - Minikube: "standard"
    # - Kind: "standard" (но может потребовать ручной настройки)
    # - Cloud (GKE/EKS/AKS): укажите соответствующий класс
    storageClass: "standard"
    size: "1Gi"
