apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: your-order-service-image
          ports:
            - containerPort: 8080
            - containerPort: 50051
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017"
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: HTTP_PORT
              value: "8080"
            - name: GRPC_PORT
              value: "50051"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: grpc
      port: 50051
      targetPort: 50051
  type: LoadBalancer