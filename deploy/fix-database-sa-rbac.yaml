apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mongodb-database
  namespace: mongodb-operator
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps", "services", "pods", "pods/log"]
    verbs: ["get", "list", "watch", "update", "patch"] # Добавлено "patch"
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mongodb-database
  namespace: mongodb-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mongodb-database
subjects:
  - kind: ServiceAccount
    name: mongodb-database
    namespace: mongodb-operator